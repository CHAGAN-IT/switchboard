services:
  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: switchboard
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  echo:
    build:
      context: servers/echo
    container_name: sb-echo
    networks:
      - switchboard-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/mcp')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ping:
    build:
      context: servers/ping
    container_name: sb-ping
    networks:
      - switchboard-internal
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/mcp')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

networks:
  switchboard-internal:
    driver: bridge

volumes:
  pgdata:
