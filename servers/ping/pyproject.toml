[project]
name = "ping"
version = "0.1.0"
description = "Ping MCP reference server"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3.2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
managed = true
