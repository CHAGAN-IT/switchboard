[project]
name = "switchboard"
version = "0.1.0"
description = "Managed MCP hosting platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "alembic>=1.18.4",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.13.1",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "pyjwt>=2.12.1",
    "docker>=7.1.0",
    "structlog>=25.0",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.26.0",
    "ruff>=0.11.0",
    "psycopg2-binary>=2.9.0",
    "mcp>=1.27.0",
    "respx>=0.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests requiring a running PostgreSQL instance",
    "reference_servers: marks tests requiring Docker images switchboard-echo and switchboard-ping to be built",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "TCH"]

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = [
    "pydantic.BaseModel",
    "sqlalchemy.orm.DeclarativeBase",
    "switchboard.db.base.Base",
]
runtime-evaluated-decorators = [
    "pydantic.validate_call",
]

[tool.ruff.lint.isort]
known-first-party = ["switchboard"]
